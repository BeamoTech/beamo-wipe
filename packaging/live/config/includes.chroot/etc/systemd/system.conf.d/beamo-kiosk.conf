# Ctrl+Alt+Del must not reboot the live session. Outside X (console guide,
# recovery menu, early boot) the kernel hands it to systemd. The 0500 hook
# masks ctrl-alt-del.target for single presses; this also ignores the burst
# of seven presses in two seconds that otherwise forces an immediate reboot.
# The wizard's Shut down action uses systemctl poweroff and is unaffected.
[Manager]
CtrlAltDelBurstAction=none
