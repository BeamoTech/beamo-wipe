# UEFI safe video only. The kiosk passes this file with
# "-config beamo-safe-video.conf" when the boot has nomodeset, the firmware
# framebuffer /dev/fb0 exists and there is no DRM device. X autodetection
# then tried only vesa, which needs a legacy video BIOS that UEFI PCs lack.
# Every other boot never reads this file (xorg.conf.d still applies).
Section "Device"
    Identifier "Beamo safe video framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
