source /boot/grub/config.cfg

# Beamo Wipe. Choosing an entry starts the on-screen guide only:
# nothing is erased until a disk is picked and confirmed there.
menuentry "Beamo Wipe: start the erase guide (nothing is erased yet)" --unrestricted --hotkey=b {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "Beamo Wipe: speech for screen readers (nothing is erased yet)" --unrestricted --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ beamo.ui=accessible
	initrd	@INITRD_LIVE@
}
menuentry "Beamo Wipe: troubleshoot startup (nothing is erased yet)" --unrestricted --hotkey=t {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --unrestricted --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI): lets an owner reach boot order or Secure Boot
	# settings without the PC's own key. It only restarts into the firmware.
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --unrestricted --hotkey=f {
			fwsetup
		}
	fi
	# No "Verify integrity" entry: live-build 1:20230502 never fills the
	# verify-checksums template markers, so the entry could not appear and the
	# unfilled marker ran as an unknown GRUB command when Utilities opened.
}
